# Single entry point: the web app at "/", the API at "/api", live updates at "/socket.io".
# Docker's DNS round-robins across scaled api replicas.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  client_max_body_size 5m;

  set $api_upstream http://api:4000;
  set $web_upstream http://web:3000;

  location /api/payments/webhook {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_request_buffering off;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
  }
}
